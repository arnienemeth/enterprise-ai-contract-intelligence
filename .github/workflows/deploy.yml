name: Build and deploy to Azure Container Apps

# Runs on every push to main that touches app code (not doc-only changes),
# and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'vector_store/**'
      - 'documents/**'
      - 'reindex.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  RG: rg-contract-ai
  APP: contract-ai-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR and roll out
        run: |
          set -e
          ACR=$(az acr list -g "$RG" --query "[0].name" -o tsv)
          ACR_SERVER=$(az acr show -n "$ACR" --query loginServer -o tsv)
          TAG="gh-${{ github.run_number }}"

          echo "Building $ACR_SERVER/contract-ai:$TAG ..."
          az acr build -r "$ACR" -t "contract-ai:$TAG" .

          echo "Updating container app to the new image ..."
          az containerapp update -n "$APP" -g "$RG" \
            --image "$ACR_SERVER/contract-ai:$TAG"

          echo "Done. Live URL:"
          echo "https://$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
